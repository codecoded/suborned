<!doctype html>
<meta charset="utf-8">
<title>Paid assets: where the money went</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#10151a;--card:#1a2229;--line:#2b3943;--fg:#e8eef0;--dim:#97a8b0;--ok:#4fc3a1;--bad:#e5645a;--warn:#e3b25a;--acc:#7fb8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,system-ui,sans-serif}
header,main{max-width:1500px;margin:0 auto;padding:0 20px}
h1{font-size:22px;margin:22px 0 4px}h2{font-size:16px;margin:26px 0 8px;font-weight:600}
.dim{color:var(--dim)}.small{font-size:12px}
.hero{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:24px}.stat.big b{font-size:34px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--dim);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.bar{display:inline-block;height:6px;background:var(--acc);border-radius:3px;vertical-align:middle;margin-left:8px}
.bar.over{background:var(--bad)}
.bad{color:var(--bad)}.warn{color:var(--warn)}.good{color:var(--ok)}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=search]{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
label{color:var(--dim)}
.grp{margin:22px 0 8px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:4px}
.grp h3{margin:0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;content-visibility:auto;contain-intrinsic-size:auto 380px}
.card.used{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.card.reject{border-color:#5a2c2c}
.card.unused .media{opacity:.82}
.media{aspect-ratio:16/9;background:#000;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block}
.media audio{width:96%}
.media .none{color:var(--dim);font-size:12px;padding:10px;text-align:center}
.t{font-weight:600;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{border-radius:4px;padding:0 6px;font-size:11px;line-height:18px;background:#2b3943;color:var(--fg)}
.badge.used{background:var(--ok);color:#06231a;font-weight:600}
.badge.via{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.badge.bad{background:var(--bad);color:#2a0a07}.badge.warn{background:var(--warn);color:#2a1d05}
.badge.where{background:transparent;border:1px solid var(--line);color:var(--dim)}
.cost{margin-left:auto;font-weight:600}
details{font-size:12px;color:var(--dim)}details pre{white-space:pre-wrap;word-break:break-word;margin:4px 0 0;font:inherit;color:var(--fg)}
a{color:var(--acc)}
.hide{display:none}
.media[data-i]{cursor:zoom-in;position:relative}
.media .play{position:absolute;inset:auto auto 8px 8px;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 7px;font-size:12px;pointer-events:none}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,8,10,.985);display:flex;flex-direction:column}
#lb.hide{display:none}
#lbStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 70px 0}
#lbStage img,#lbStage video{max-width:100%;max-height:100%;object-fit:contain;display:block}
#lbStage audio{width:min(700px,90%)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:90px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:var(--fg);font-size:34px;cursor:pointer}
#lb .nav:hover{background:rgba(255,255,255,.16)}#lb .nav:disabled{opacity:.2;cursor:default}
#lbPrev{left:10px}#lbNext{right:10px}
#lbClose{position:absolute;top:10px;right:14px;border:0;background:none;color:var(--fg);font-size:28px;cursor:pointer;z-index:2}
#lbCap{padding:8px 70px 12px;display:flex;flex-direction:column;gap:3px;max-height:28vh;overflow:auto}
#lbCap .row .t{font-size:15px}
</style>
<header>
  <h1>Paid assets: where the money went</h1>
  <div class="dim small" id="built"></div>
  <div class="hero" id="hero"></div>
  <div class="small dim" id="balance"></div>
</header>
<main>
  <div class="tables" id="tables"></div>
  <h2>Every asset</h2>
  <div class="controls">
    <label>Job <select id="fJob"></select></label>
    <label>Model <select id="fModel"></select></label>
    <label>Status <select id="fStatus"><option value="">all</option><option>ok</option><option>failed</option><option>blocked</option></select></label>
    <label>Show <select id="fUse"><option value="">everything</option><option value="used">used only</option><option value="unused">unused (rejects) only</option></select></label>
    <label>Sort <select id="fSort"><option value="time">time (old to new)</option><option value="timeDesc">time (new to old)</option><option value="costDesc">cost (high to low)</option><option value="costAsc">cost (low to high)</option></select></label>
    <input type="search" id="fText" placeholder="search file, prompt, note">
    <span class="dim small" id="count"></span>
  </div>
  <div id="groups"></div>
</main>
<div id="lb" class="hide" role="dialog" aria-modal="true">
  <button id="lbClose" title="Close (Esc)">×</button>
  <div id="lbStage"></div>
  <button class="nav" id="lbPrev" title="Previous (←)">‹</button>
  <button class="nav" id="lbNext" title="Next (→)">›</button>
  <div id="lbCap"></div>
</div>
<script type="application/json" id="data">/*DATA*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.spend, ROWS = D.rows;
const $ = id => document.getElementById(id);
const usd = x => '$' + (x || 0).toFixed(2);
const usd3 = x => (x == null ? '?' : '$' + x.toFixed(3));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isCall = r => ['image','video','audio'].includes(r.task);
const isUsed = r => (r.used_in || []).some(u => !String(u).startsWith('via '));

$('built').textContent = 'Built ' + D.built + ' from paid/*/ledger.jsonl (rollup committed as tools/paid/spend.json). Load: thumbnails only, media on click.';
const jobs = Object.entries(S.jobs);
const stat = (label, val, cls='') => `<div class="stat ${cls}"><span class="dim small">${label}</span><b>${val}</b></div>`;
const usedTotal = S.used, costPerUsed = usedTotal ? S.total_usd / usedTotal : null;
$('hero').innerHTML = stat('Spent, all time', usd(S.total_usd), 'big') + stat('Calls', S.calls) +
  stat('Failed / blocked', `<span class="${S.failed + S.blocked ? 'warn' : ''}">${S.failed} / ${S.blocked}</span>`) +
  stat('Used assets', usedTotal) + stat('Per used asset', costPerUsed == null ? '-' : usd(costPerUsed)) +
  stat('Jobs', jobs.length);
$('balance').innerHTML = 'Runware balance: Runware documents no balance or usage endpoint (its help centre says the balance shows at the top right of the dashboard, with usage history and export under Usage), so nothing is fetched here. Compare the dashboard with the total above.';

function table(title, head, rows) {
  return `<div><h2>${title}</h2><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
const max = (o, f) => Math.max(1e-9, ...Object.values(o).map(f));
let T = '';
T += table('Per job', ['job','spent','calls','failed','blocked','used','per used'],
  jobs.map(([k, j]) => [esc(k), usd(j.total_usd) + `<span class="bar" style="width:${Math.round(100 * j.total_usd / Math.max(1e-9, S.total_usd))}px"></span>`, j.calls,
    j.failed ? `<span class="bad">${j.failed}</span>` : 0, j.blocked ? `<span class="warn">${j.blocked}</span>` : 0, j.used, j.cost_per_used == null ? '-' : usd(j.cost_per_used)]));
const passRows = [];
for (const [k, j] of jobs) for (const [p, b] of Object.entries(j.by_pass)) passRows.push([esc(k), esc(p), usd(b.usd), b.budget_usd ? usd(b.budget_usd) + (b.usd > b.budget_usd ? ' <span class="bad">over</span>' : '') : '<span class="dim">closed' + (b.prior_budget_usd ? ' (was ' + usd(b.prior_budget_usd) + ')' : '') + '</span>', b.calls]);
T += table('Per pass', ['job','pass','spent','budget','calls'], passRows);
T += table('Per model', ['model','spent','calls'], Object.entries(S.by_model).sort((a, b) => b[1].usd - a[1].usd).map(([k, v]) => [esc(k), usd(v.usd), v.calls]));
T += table('Per day', ['day','spent','calls'], Object.entries(S.by_day).sort().map(([k, v]) => [esc(k), usd(v.usd) + `<span class="bar" style="width:${Math.round(120 * v.usd / max(S.by_day, x => x.usd))}px"></span>`, v.calls]));
$('tables').innerHTML = T;

for (const [id, vals] of [['fJob', jobs.map(j => j[0])], ['fModel', Object.keys(S.by_model).sort()]])
  $(id).innerHTML = '<option value="">all</option>' + vals.map(v => `<option>${esc(v)}</option>`).join('');

let VIEW = [];  // rows with media on this machine, in the order shown; the lightbox steps through these
const hasMedia = r => r.exists && ['image','video','audio'].includes(r.media);
const nameOf = r => (r.file || (r.ref && r.ref.path) || '').split('/').pop() || `${r.task} #${r.id}`;
function card(r) {
  const used = isUsed(r), call = isCall(r), bad = r.status && r.status !== 'ok';
  const cls = ['card', used ? 'used' : (call ? 'unused' : ''), bad ? 'reject' : ''].join(' ');
  let media;
  if (!r.media || r.media === 'file') media = '<div class="none">' + (r.file || r.ref ? 'file not on this machine' : esc(r.status || r.task)) + '</div>';
  else if (!r.exists) media = '<div class="none">file not on this machine</div>';
  else if (r.media === 'image') media = `<img loading="lazy" decoding="async" src="${esc(r.thumb || r.src)}" alt="">`;
  else if (r.media === 'video') media = (r.thumb ? `<img loading="lazy" decoding="async" src="${esc(r.thumb)}" alt="">` : `<video preload="metadata" muted src="${esc(r.src)}#t=0.5"></video>`) + `<span class="play">▶ ${r.duration_s ? esc(r.duration_s) + ' s' : 'video'}</span>`;
  else if (r.media === 'audio') media = `<span class="none">♪ audio · click to play</span>`;
  const i = hasMedia(r) ? VIEW.indexOf(r) : -1;
  return `<div class="${cls}"><div class="media"${i >= 0 ? ` data-i="${i}"` : ''}>${media}</div>` + caption(r) + '</div>';
}
function caption(r) {  // name, cost, meta, badges, prompt: shared by the card and the lightbox
  const used = isUsed(r), call = isCall(r), bad = r.status && r.status !== 'ok';
  const name = nameOf(r);
  const badges = [];
  for (const u of r.used_in || []) badges.push(String(u).startsWith('via ') ? `<span class="badge via" title="feeds a used asset">${esc(u)}</span>` : `<span class="badge used">used in ${esc(u)}</span>`);
  if (call && !used && !bad) badges.push('<span class="badge">not used</span>');
  if (bad) badges.push(`<span class="badge ${r.status === 'failed' ? 'bad' : 'warn'}">${esc(r.status)}</span>`);
  if (r.cost_usd == null && call) badges.push('<span class="badge warn">cost unknown</span>');
  if (r.where && r.where !== 'paid') badges.push(`<span class="badge where">${esc({'repo-committed':'committed in repo','repo-local':'in repo, git-ignored','store':'old store, outside repo'}[r.where] || r.where)}</span>`);
  if (r.at_source && r.at_source !== 'call') badges.push(`<span class="badge where" title="date taken from ${esc(r.at_source)}">date: ${esc(r.at_source)}</span>`);
  const meta = [r.task, r.model, r.size, r.duration_s ? r.duration_s + ' s' : '', r.seed != null ? 'seed ' + r.seed : '', (r.at || '').replace('T', ' ').slice(0, 16)].filter(Boolean).join(' · ');
  const det = [];
  if (r.prompt) det.push(`<details><summary>prompt</summary><pre>${esc(r.prompt)}</pre></details>`);
  if ((r.refs || []).length) det.push(`<details><summary>refs (${r.refs.length})</summary><pre>${esc(r.refs.join('\n'))}</pre></details>`);
  if (r.note) det.push(`<div class="small dim">${esc(r.note)}</div>`);
  if (r.sha256) det.push(`<details><summary>sha256, params</summary><pre>${esc(r.sha256)}${r.params && Object.keys(r.params).length ? '\n' + esc(JSON.stringify(r.params)) : ''}</pre></details>`);
  return `<div class="row"><span class="t">${esc(name)}</span><span class="cost ${call ? '' : 'dim'}">${call ? usd3(r.cost_usd) : ''}</span></div>` +
    `<div class="small dim">${esc(meta)}</div><div class="row">${badges.join('')}</div>${det.join('')}`;
}

function render() {
  const f = { job: $('fJob').value, model: $('fModel').value, status: $('fStatus').value, use: $('fUse').value, text: $('fText').value.toLowerCase(), sort: $('fSort').value };
  let rows = ROWS.filter(r => (!f.job || r.job === f.job) && (!f.model || r.model === f.model) && (!f.status || r.status === f.status) &&
    (!f.use || (f.use === 'used' ? isUsed(r) : (isCall(r) && !isUsed(r)))) &&
    (!f.text || [r.file, r.prompt, r.note, r.ref && r.ref.path].join(' ').toLowerCase().includes(f.text)));
  const cmp = { time: (a, b) => a.id - b.id, timeDesc: (a, b) => b.id - a.id, costDesc: (a, b) => (b.cost_usd || 0) - (a.cost_usd || 0), costAsc: (a, b) => (a.cost_usd || 0) - (b.cost_usd || 0) }[f.sort];
  const groups = new Map();
  for (const r of rows) { const k = r.job + '\u0000' + r.pass; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  const keys = [...groups.keys()].sort();
  for (const k of keys) groups.get(k).sort((a, b) => cmp(a, b) || a.id - b.id);
  VIEW = keys.flatMap(k => groups.get(k)).filter(hasMedia);
  $('groups').innerHTML = keys.map(k => {
    const [job, pass] = k.split('\u0000'), rs = groups.get(k);
    const sum = rs.reduce((s, r) => s + (isCall(r) ? (r.cost_usd || 0) : 0), 0);
    return `<div class="grp"><h3>${esc(job)} · pass ${esc(pass)}</h3><span class="dim small">${rs.length} rows · ${usd(sum)} shown</span></div><div class="grid">${rs.map(card).join('')}</div>`;
  }).join('');
  $('count').textContent = rows.length + ' of ' + ROWS.length + ' rows · ' + usd(rows.reduce((s, r) => s + (isCall(r) ? (r.cost_usd || 0) : 0), 0)) + ' in view';
}
let LB = -1;
function lbShow(i) {
  if (!VIEW.length) return;
  LB = Math.max(0, Math.min(VIEW.length - 1, i));
  const r = VIEW[LB], st = $('lbStage');
  st.innerHTML = r.media === 'image' ? `<img src="${esc(r.src)}" alt="">`
    : r.media === 'video' ? `<video controls autoplay loop playsinline ${r.thumb ? `poster="${esc(r.thumb)}"` : ''} src="${esc(r.src)}"></video>`
    : `<audio controls autoplay src="${esc(r.src)}"></audio>`;
  // the caption is the card's own text (name, cost, meta, badges, prompt), plus position and a link to the file
  const body = caption(r);
  $('lbCap').innerHTML = `<div class="small dim">${LB + 1} of ${VIEW.length} in view · ${esc(r.job)} · pass ${esc(r.pass)} · <a href="${esc(r.src)}" target="_blank">open file</a> · ← → to move, Esc to close</div>` + body;
  $('lbPrev').disabled = LB === 0; $('lbNext').disabled = LB === VIEW.length - 1;
  for (const n of [VIEW[LB - 1], VIEW[LB + 1]]) if (n && n.media === 'image') new Image().src = n.src;  // preload neighbours
  $('lb').classList.remove('hide'); document.body.style.overflow = 'hidden';
}
function lbClose() { LB = -1; $('lbStage').innerHTML = ''; $('lb').classList.add('hide'); document.body.style.overflow = ''; }
$('groups').addEventListener('click', e => { const m = e.target.closest('.media[data-i]'); if (m) lbShow(+m.dataset.i); });
$('lbPrev').onclick = () => lbShow(LB - 1); $('lbNext').onclick = () => lbShow(LB + 1); $('lbClose').onclick = lbClose;
$('lb').addEventListener('click', e => { if (e.target.id === 'lb' || e.target.id === 'lbStage') lbClose(); });
document.addEventListener('keydown', e => {
  if (LB < 0) return;
  if (e.key === 'ArrowLeft') { lbShow(LB - 1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { lbShow(LB + 1); e.preventDefault(); }
  else if (e.key === 'Home') lbShow(0); else if (e.key === 'End') lbShow(VIEW.length - 1);
  else if (e.key === 'Escape') lbClose();
});
let tx = null;  // swipe on a trackpad-less touch screen
$('lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('lb').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) lbShow(LB + (dx < 0 ? 1 : -1)); });
for (const id of ['fJob','fModel','fStatus','fUse','fSort']) $(id).addEventListener('change', render);
$('fText').addEventListener('input', render);
render();
</script>
