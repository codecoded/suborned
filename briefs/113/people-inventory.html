const state={who:0,stage:4,view:'book',closed:false,sent:-1};
const content=document.querySelector('#content'),surface=document.querySelector('#surface'),select=document.querySelector('#stageSelect');
function tabs(){return '<div class="tabs" aria-label="People">'+cast.map((c,i)=>'<button data-who="'+i+'" aria-pressed="'+(i===state.who)+'">'+c.first+'</button>').join('')+'</div>'}
function toolbar(){return '<div class="toolbar"><span class="eyebrow">City contacts</span><button class="close" aria-label="Close contacts" data-close>×</button></div>'}
function fact(tag,words){return '<div class="fact"><b>'+tag+'</b><span>'+words+'</span></div>'}
function action(p){
 if(state.sent>=0) return '<div class="actionArea" role="status"><div><span class="eyebrow">Visit arranged · +1 Trail</span><p class="outcome">'+(state.sent===0?'Inez called Arthur.':'Arthur took your call.')+' He’s on his way to the café.</p></div></div>';
 const ready=state.stage===4||(state.stage===3&&state.who===0);
 if(!ready) return '<div class="actionArea"><div><span class="eyebrow">Favours</span><p>'+(state.stage>=2?'You know the connection. '+p.first+' hasn’t agreed to help.':'No favours earned.')+'</p></div></div>';
 return '<div class="actionArea"><div><span class="eyebrow">Earned favour</span><p>'+p.ready+'</p></div><button class="call" data-call>'+p.offer+' <span class="price">+1 Trail</span></button></div>'}
function draw(){
 const {who,stage,view,closed}=state,p=cast[who],other=cast[1-who],person='<button class="link" data-who="'+(1-who)+'">'+other.first+'</button>';
 const saw=who===0?'Arthur stops at her café.':'He visits Inez at the café.';
 const heard=who===0?'Arthur is her partner. He answers her calls.':'Inez is his partner. He’ll go to her when she calls.';
 const info=stage<1?'Seen at the '+(who===0?'café.':'Records Office.'):(stage===1?saw:heard);
 const connected=(stage===1?saw:heard).replace(other.first,person);
 const evidence=(stage===0?fact('Seen',info):fact('Seen',saw.replace(other.first,person)))+(stage>=2?fact('Heard',heard):'');
 surface.className='stage '+view+(closed?' closed':'');
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));select.value=stage;
 if(closed){content.innerHTML='<button class="open" data-close>Contacts</button>';return}
 const photo='<img alt="'+p.name+'" src="'+p.image+'">';
 if(view==='book')content.innerHTML='<article class="book">'+tabs()+'<section class="sheet">'+toolbar()+'<div class="profile"><figure class="photo">'+photo+'<figcaption>'+p.place+'</figcaption></figure><div><h1 class="identity">'+p.name+'</h1><p class="role">'+p.job+' · '+p.place+'</p><div class="evidence">'+evidence+'</div></div></div>'+action(p)+'</section></article>';
 else content.innerHTML='<section class="drawer">'+toolbar()+tabs()+'<div class="compact">'+photo+'<div><h2>'+p.name+'</h2><p>'+p.job+' · '+p.place+'</p></div></div><p class="detail"><span class="eyebrow">'+(stage>=2?'Heard':stage===1?'Watched':'Seen')+'</span> &nbsp;'+(stage===0?info:connected)+'</p>'+action(p)+'</section>'}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){state.view=b.dataset.view;state.closed=false}
 else if(b.dataset.who!==undefined){state.who=Number(b.dataset.who)}
 else if(b.hasAttribute('data-close'))state.closed=!state.closed;
 else if(b.hasAttribute('data-call'))state.sent=state.who;
 else if(b.id==='reset'){state.stage=4;state.who=0;state.sent=-1;state.closed=false}
 draw();
 if(b.hasAttribute('data-close'))document.querySelector('[data-close]')?.focus();
 else if(b.dataset.who!==undefined)document.querySelector('.tabs [aria-pressed="true"]')?.focus();
});
select.addEventListener('change',()=>{state.stage=Number(select.value);state.sent=-1;state.closed=false;draw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.closed){state.closed=true;draw();document.querySelector('[data-close]')?.focus()}});
if(location.hash==='#exchange'){state.view='street';state.who=1}
draw();
</script></body></html>
