const [inez, arthur, heidi, dustin] = people.map(person => person.id);
const contact = id => people.find(person => person.id === id);
const el = id => document.getElementById(id);
const direct = new Set();
const requested = new Set();
let seen, focus;

function reset() {
  direct.clear();
  direct.add(inez);
  requested.clear();
  seen = links.slice(0, 2);
  focus = heidi;
}

// Walk only ties the player has learned, starting from people who will take their call.
function routeTo(destination) {
  const queue = Array.from(direct, id => [id]);
  const visited = new Set(direct);
  for (const route of queue) {
    const here = route.at(-1);
    if (here === destination) return route;
    for (const {a, b} of seen) {
      const next = a === here ? b : b === here ? a : null;
      if (next && !visited.has(next)) {
        visited.add(next);
        queue.push([...route, next]);
      }
    }
  }
  return [];
}

    if (!requested.has(focus)) buttons.push('<button class="primary" data-tip>'+favour+'</button>');
  }
  if (!direct.has(focus)) buttons.push('<button class="more" data-intro>Ask '+ally.first+' for an introduction</button>');
  if (focus === heidi && !routeTo(dustin).length) buttons.push('<button class="more" data-listen>Try listening to Heidi</button>');
  const waiting = requested.has(focus) ? '<p class="sub">'+(focus===heidi?'Heidi will call when Arthur visits.':'Dustin will call at shift change.')+'</p>' : '';
  el('record').innerHTML = '<div class="record"><div class="portrait">'+portrait+'</div><div><h1>'+person.name+'</h1><p class="sub">'+person.job+' · '+(direct.has(focus)?'Direct contact':route.length+' degrees away')+'</p></div></div><p class="note">'+person.note+'</p><div class="actions">'+buttons.join('')+'</div>'+waiting;
}

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  let message = '';
  if (button.id === 'reset') reset();
  else if (button.dataset.id) focus = button.dataset.id;
  else if (button.hasAttribute('data-intro')) {
    const via = contact(routeTo(focus).at(-2));
    direct.add(focus);
    message = via.first+' vouches for you. '+contact(focus).first+' agrees to speak directly.';
  } else if (button.hasAttribute('data-listen')) {
    seen.push(links[2]);
    focus = dustin;
    message = 'Heidi mentions her family at Records. You have a way to reach Dustin.';
  } else if (button.hasAttribute('data-tip')) {
    const via = routeTo(focus).slice(0,-1).map(id => contact(id).first);
    requested.add(focus);
    message = via.length ? 'Request passed through '+via.join(' → ')+'.' : contact(focus).first+' takes your call.';
  } else if (button.hasAttribute('data-book')) {
    message = people.filter(person => routeTo(person.id).length).map(person =>
      '<button class="more" data-id="'+person.id+'">'+person.first+'</button>'
    ).join(' · ');
  }
  draw();
  el('status').innerHTML = message;
});
reset();
draw();
</script></html>
