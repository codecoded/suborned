<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People of the Harbour District</title><style>
:root{--ink:#1c352e;--paper:#eee8d7;--radius:5px;--foreground:var(--ink);--ring:#a54026;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:15px/1.35 system-ui,sans-serif}main{max-width:1000px;margin:auto}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ba542e;outline-offset:2px}
.directory{background:var(--paper);color:var(--ink);padding:16px;border-radius:var(--radius);position:relative}
header{border-top:5px solid var(--ink);padding:13px 0 10px;display:flex;align-items:end;justify-content:space-between;gap:10px;border-bottom:1px solid #928f7b;margin-bottom:10px}
.district,.label{font:650 10px/1.1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.15em}h1{font:normal clamp(34px,7vw,58px)/.98 Georgia,serif;letter-spacing:-.045em;margin:3px 0 0}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-content:start;gap:13px 9px;max-height:455px;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#7f8875 transparent;scrollbar-width:thin;padding:3px 4px 8px}
.tile{padding:0;min-width:0;background:transparent;border:0;text-align:left;align-self:start}.photo{display:block;aspect-ratio:1;width:100%;object-fit:cover;background:#d7cebb;border:1px solid #787c67}.tile:hover .photo,.tile:focus-visible .photo{outline:2px solid var(--ink);outline-offset:-2px}.name{display:block;font:600 13px/1.15 system-ui;margin:5px 0 0;overflow-wrap:anywhere}
dialog{position:absolute;inset:0;margin:auto;width:min(375px,95%);max-height:96%;overflow:auto;background:#f8f3e5;color:var(--ink);padding:20px;border:1px solid #898775;box-shadow:0 8px 28px #192b2447;border-radius:4px}
dialog[open]{z-index:2}dialog::backdrop{background:#20302655}.person{display:flex;align-items:center;gap:14px;padding-right:15px}.person img{width:82px;height:82px}.person h2{font:normal 26px/1 Georgia,serif;letter-spacing:-.03em;margin:3px 0}.person p{margin:6px 0 0;font-size:13px}.close{position:absolute;right:6px;top:4px;border:0;background:transparent;font-size:24px}.linkface{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:3px 7px 3px 0;font-size:13px}.linkface img{width:29px;height:29px}.links{margin-top:12px}.links .label{margin:0 0 3px}.act{display:block;width:100%;padding:9px;border:0;border-radius:3px;background:#235446;color:white;text-align:center;margin-top:8px}.act.secondary{background:#e6e4d2;color:var(--ink)}.result{display:block;margin-top:8px;font-size:13px;color:#415548}.result:empty{display:none}.empty{margin:20px 2px;font-size:14px}
@media(min-width:840px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-width:530px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;max-height:430px}.directory{padding:12px}.name{font-size:11px}header{padding-top:9px}}
</style></head><body><main><section class="directory" aria-label="City contact inventory"><header><div><div class="district">Harbour District</div><h1>People</h1></div><input type="search" id="search" aria-label="Find a person" placeholder="Find a person"></header>

const [inez,arthur,heidi,dustin]=cast.slice(0,4).map(p=>p.id);
const discovered=[[inez,arthur],[arthur,heidi],[heidi,dustin]];
const direct=new Set([inez]);
const used=new Map();
const byId=new Map(cast.map(p=>[p.id,p]));
const get=id=>document.getElementById(id);
const grid=get('grid'), dialog=get('detail'), search=get('search');
let selected,opener;
function photo(p){return '<img class="photo" alt="" src="'+images[p.id]+'">'}
function normalized(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filter(){
 const query=normalized(search.value.trim());
 const matches=cast.filter(p=>normalized(p.name+' '+p.job).includes(query));
 grid.innerHTML=matches.map(p=>'<button class="tile" data-person="'+p.id+'">'+photo(p)+'<span class="name">'+p.name+'</span></button>').join('');
 grid.scrollTop=0;get('empty').hidden=matches.length>0;
}
function neighbours(id){return discovered.filter(pair=>pair.includes(id)).map(pair=>pair.find(p=>p!==id))}
function routeTo(id){
 const queue=Array.from(direct,first=>[first]), seen=new Set(direct);
 for(const route of queue){
  const last=route.at(-1);if(last===id)return route;
  for(const next of neighbours(last))if(!seen.has(next)){seen.add(next);queue.push([...route,next])}
 }
 return [];
}
const requests={
 [inez]:['Have Inez call Arthur','Inez has called. Arthur is heading to the café.'],
 [arthur]:['Ask Arthur to meet Inez','Arthur agrees to meet Inez at the café.'],
 [heidi]:['Ask when Arthur visits','Heidi will send word when Arthur arrives.'],
 [dustin]:['Ask about the shift change','Dustin will call at shift change.']
};
let visitArranged=false;
function show(id){
 selected=id;
 const p=byId.get(id), route=routeTo(id), links=neighbours(id), ask=requests[id];
 const through=route.length>1?'Through '+route.slice(0,-1).map(k=>byId.get(k).name.split(' ')[0]).join(' → '):'';
 const linkGroup=links.length?'<div class="links"><p class="label">Known connections</p>'+links.map(k=>'<button class="linkface" data-person="'+k+'">'+photo(byId.get(k))+byId.get(k).name.split(' ')[0]+'</button>').join('')+'</div>':'';
 const actions=[];
 const sameVisit=visitArranged&&(id===inez||id===arthur);
 if(ask && !used.has(id) && !sameVisit)actions.push('<button class="act" data-action="ask">'+ask[0]+'</button>');
 if(route.length>1)actions.push('<button class="act secondary" data-action="intro">Ask for an introduction</button>');
 get('card').innerHTML='<div class="person">'+photo(p)+'<div><h2 id="selectedName">'+p.name+'</h2><p>'+p.job+'</p></div></div>'+linkGroup+(through?'<p class="result">'+through+'</p>':'')+actions.join('');
 get('result').textContent=used.get(id)||(sameVisit?'The café visit is arranged.':'');
 if(!dialog.open){opener=document.activeElement;dialog.showModal()}
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.person)show(b.dataset.person);
 else if(b.id==='close')dialog.close();
 else if(b.dataset.action==='intro'){direct.add(selected);show(selected);get('result').textContent=byId.get(selected).name.split(' ')[0]+' will take your call directly.'}
 else if(b.dataset.action==='ask'){used.set(selected,requests[selected][1]);if(selected===inez||selected===arthur)visitArranged=true;show(selected)}
});
dialog.addEventListener('close',()=>opener?.focus({preventScroll:true}));
search.addEventListener('input',filter);filter();
</script></body></html>
