.mast:after{inset:7px;border:1px solid #d6d8b332;border-bottom-color:transparent}
.district,.label,.flag,.scope,.index-count,.detail-job,.new-note,.stamp{font-family:var(--font-sans);font-weight:600;letter-spacing:.12em;text-transform:uppercase}.district{font-size:11px;color:#eee1b4;display:flex;align-items:center;gap:9px;text-shadow:0 1px 2px #101b17}
.district:before{content:"✦";font-size:18px;line-height:1}.district:after{content:"";width:45px;height:1px;background:#d9ba75}
h1{font:normal clamp(38px,7vw,61px)/1.02 Georgia,serif;color:#fff1d5;letter-spacing:-.045em;margin:3px 0 0;text-shadow:0 2px 5px #152922}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(12px,2.5vw,24px);background:linear-gradient(#263e3a,#213734);border-bottom:1px solid #56655a}
.scopes{display:flex;gap:17px;align-self:stretch}.scope{position:relative;border:0;background:transparent;padding:14px 0 13px;font-size:11px;letter-spacing:.07em;color:#c2cec2;white-space:nowrap}.scope[aria-pressed=true]{color:#ffe5ae}.scope[aria-pressed=true]:after{content:"";position:absolute;bottom:0;height:3px;left:0;right:0;background:var(--gold)}.scope span{font-variant-numeric:tabular-nums;font-size:10px;opacity:.86;letter-spacing:0;margin-left:3px}
.search{display:flex;align-items:center;gap:7px;width:clamp(100px,22vw,190px);border-bottom:1px solid #7e8d7d}.glass{display:block;width:11px;height:11px;border-radius:50%;border:1.5px solid #d4d5bd;position:relative;flex:none}.glass:after{content:"";position:absolute;top:8px;left:8px;width:5px;height:1.5px;background:#d4d5bd;transform:rotate(45deg)}
input{width:100%;min-width:0;background:transparent;border:0;padding:5px 1px;color:#fff1d5;font-size:14px}input::placeholder{color:#cdd5c6}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-content:start;gap:12px 10px;max-height:457px;min-height:210px;overflow:auto;overscroll-behavior:contain;scrollbar-color:#7c8c76 #172e2d;scrollbar-width:thin;padding:15px clamp(12px,2.5vw,24px) 18px;background:radial-gradient(ellipse at 48% 0,#304640,#172f2e 76%)}
.tile{position:relative;display:flex;flex-direction:column;align-items:stretch;padding:3px;border:1px solid #718174;border-radius:2px;background:linear-gradient(155deg,#415448,#172e2a);box-shadow:0 2px 3px #081a1980;min-width:0;text-align:left;transition:background .12s,border-color .12s}
.photo{display:block;width:100%;aspect-ratio:1;object-fit:cover}.frame{position:relative;display:block;overflow:hidden;border:1px solid #0f221ec9}.frame:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 12px #392c1326;pointer-events:none}
.name{flex:1;color:#f2ebd9;padding:6px 3px 4px;display:block;font-size:clamp(12px,1.7vw,15px);font-weight:500;line-height:1.12;overflow-wrap:anywhere}.tile:hover,.tile:focus-visible{border-color:#e7ca8c;background:#354b40}.tile:hover .name{color:#ffe1a4}
.flag{position:absolute;z-index:1;left:-3px;top:5px;font-size:9px;letter-spacing:.11em;line-height:17px;padding:0 9px 0 6px;color:#312719;background:#edc482;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 50%,100% 100%,0 100%)}
.base{display:flex;align-items:center;gap:10px;background:#1b302d;border-top:1px solid #526257;padding:6px clamp(12px,2.5vw,24px);color:#c4cdbd}.base:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#73806c66,#73806c10)}.index-count{font-size:10px;letter-spacing:.13em}
.empty{grid-column:1/-1;text-align:center;font-size:16px;color:#e5e3d0;padding:45px 0}
dialog{position:fixed;inset:0;margin:auto;width:min(455px,calc(100% - 28px));max-height:92%;overflow:auto;padding:0;border:1px solid #b5a279;border-radius:5px;background:var(--paper);color:var(--ink);box-shadow:0 12px 65px #061915b0}
dialog::backdrop{background:#061b1acc;backdrop-filter:blur(2px)}.detail-head{display:flex;align-items:end;gap:17px;padding:20px 36px 18px 18px;background:linear-gradient(120deg,#314b40,#152f30);color:#faf0d8;border-bottom:3px double #a69974}.detail-head .photo{width:94px;flex:none;padding:3px;background:#e4d9bf;border:1px solid #a9a68a;box-shadow:0 3px 7px #06181470}
h2{font:normal 33px/1 Georgia,serif;letter-spacing:-.035em;margin:5px 0 2px}.detail-job{font-size:10px;color:#d5c397}.close{position:absolute;right:8px;top:8px;border:1px solid #849487;background:#183431;color:#e4e8da;border-radius:2px;width:27px;height:27px;font:21px/1 system-ui}
.detail-body{padding:16px 20px 18px}.intel{margin:0 0 15px;padding:0 0 12px;border-bottom:1px solid #afa994;font-size:16px}.new-note{font-size:10px;color:#68450c;background:#ecd298;padding:2px 4px;margin-right:5px}.links{margin:0 0 10px}.label{font-size:10px;color:#526457;margin:0 0 5px}.linkface{display:inline-flex;align-items:center;gap:6px;margin:0 6px 4px 0;padding:3px 9px 3px 3px;border:1px solid #a8ae99;border-radius:2px;color:#213f34;background:#f6efda;font-size:14px}.linkface:hover{background:#fff9eb}.linkface img{width:26px;height:26px}
.through,.result,.quiet{font-size:14px;margin:4px 0 10px;color:#415345}.act{display:block;width:100%;padding:9px 12px;background:#1d5146;color:#fff2d8;border:1px solid #163c34;border-radius:3px;font-size:16px;font-weight:550;margin-top:7px}.act:hover{background:#2b6255}.act.secondary{background:transparent;border-color:#a5ad97;color:#264a40}.stamp{font-size:10px;color:#356959;display:block;margin:13px 0 -2px}.result{padding:0 20px 14px;margin:0}.result:empty{display:none}

const [inez,arthur]=cast;
const get=id=>document.getElementById(id);
const grid=get('grid'),dialog=get('detail');
const key='suborned.113.inez-call.v1';
let saved={};
try {saved=JSON.parse(localStorage.getItem(key))||{}} catch {}
// Street preview begins after the crew has identified Inez at the café.
let stage=[0,1,2,3].includes(saved.stage)?saved.stage:0;
const unread=new Set(Array.isArray(saved.unread)?saved.unread:[inez.id]);
let selected,opener;
function save(){
 try {localStorage.setItem(key,JSON.stringify({stage,unread:[...unread]}))} catch {}
}
function photo(p){return '<img class="photo" alt="" src="'+images[p.id]+'">'}
function drawGrid(){
 const known=stage===0?[inez]:cast;
 grid.innerHTML=known.map(p=>'<button class="tile" data-person="'+p.id+'"><span class="frame">'+photo(p)+'</span><span class="name">'+p.name+'</span>'+(unread.has(p.id)?'<span class="flag">New</span>':'')+'</button>').join('');
 get('count').textContent=known.length+(known.length===1?' contact':' contacts');
 get('preview').hidden=stage>=2;
 get('observe').textContent=stage===0?'Listen at the café':'Help Inez';
}
function show(p){
 if(!p||(p===arthur&&stage===0))return;
 if(!dialog.open)opener=p;
 selected=p;
 const fresh=unread.delete(p.id);
 if(fresh)save();
 const other=p===inez?arthur:inez;
 const note=p===inez?[
  'You spotted Inez at the café.',
  'Arthur is her partner. He answers her calls.',
  'Inez has agreed to call Arthur away from his post when you give the word.',
  'Inez made the call. Arthur is on his way to the café.'
 ][stage]:stage===3?'Arthur has left his post to see Inez.':'Arthur guards the Records Office. He’ll come to the café when Inez calls.';
 const connection=stage>0?'<div class="links"><p class="label">Known connection</p><button class="linkface" data-person="'+other.id+'">'+photo(other)+other.name+'</button></div>':'';
 const call=p===inez&&stage===2?'<span class="stamp">Earned favour</span><button class="act" id="call">Call Arthur · +1 Trail</button>':'';
 get('card').innerHTML='<div class="detail-head">'+photo(p)+'<div><div class="detail-job">'+p.job+'</div><h2 id="selectedName">'+p.name+'</h2></div></div><div class="detail-body"><p class="intel">'+(fresh?'<span class="new-note">New</span> ':'')+note+'</p>'+connection+call+'</div>';
 get('result').textContent='';
 if(!dialog.open)dialog.showModal();
 else get('close').focus();
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.person)show(cast.find(p=>p.id===b.dataset.person));
 else if(b.id==='close')dialog.close();
 else if(b.id==='observe'&&stage<2){
  stage++;unread.add(inez.id);if(stage===1)unread.add(arthur.id);
  save();drawGrid();
  grid.querySelector('[data-person="'+(stage===1?arthur.id:inez.id)+'"]').focus();
 }else if(b.id==='call'&&stage===2&&selected===inez){
  stage=3;save();show(inez);get('result').textContent='Visit arranged · +1 Trail';
 }
});
dialog.addEventListener('close',()=>{
 drawGrid();grid.querySelector('[data-person="'+opener.id+'"]')?.focus({preventScroll:true});
});
drawGrid();
</script></body></html>
