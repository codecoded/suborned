const caps=["Before, build 0.2.32: the bottom bar (outlined) lists seven key caps on the same screen as the fight. Sky: 'if it needs that much explaining something's wrong.'","The same moment without the bar. The line at the target already says what matters now: who, how long, the mouse held. Nothing else is taught here, because the player has just used LMB. The bar's other keys come back one at a time, on the thing, the first few times they matter, and then never again.","Vale's doors open, two officers come in (the beat line). The first time a hostile appears with agents idle, a ghost of the gesture runs from a portrait to the officer: one cap, 'drag'. No sentence. It plays three times in the game, never again once the player has done it.","Scout and Tech are on the first officer (tracers, a bracket with their numbers, the lock mark on their portraits). The Fixer's portrait is being dragged onto the second: the rubber line, the target pulsing, one price line at the cursor ('down in 6 s'). While the drag is held the world runs at a quarter speed (¼ on the clock, turquoise rim, the freeze look) and for half a second after it. Drop: Fixer is locked and the clock returns."];
