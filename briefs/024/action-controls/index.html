<script>
const caps=["Facing Inez: the prompt names the act and its price in one line. E acts, so does a left click on her (setting). Hold E (the dots) opens the options.","Holding E 0.22 s opens the ring on her. Release over a wedge takes it. The temperament is unknown (?), so E alone would have opened this. Pressure is dashed: never lit.","Right button held: reticle at the cursor, gun drawn. Left button fires. The guard is not hostile, so Fire is a hold (the ring fills) and the pill carries the loud mark.","Left button held: a tracer runs from the gun to the guard, the muzzle flashes, the agent and its portrait wear the firing mark, and one line says who it fires at and how long. The Fixer (not driven) returns fire: thin tracer, return mark on her and her portrait. Release, or X, stops it.","Release: the tracer cuts at once, the marks go, and the line reads Stopped for 1 s. The gun stays drawn (portrait mark filled) until F or auto-holster."];
function show(n){document.querySelectorAll('svg.stage').forEach(e=>e.classList.toggle('on',e.id==='st'+n));document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s==n));document.getElementById('cap').textContent=caps[n-1]}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.s));addEventListener('keydown',e=>{if('12345'.includes(e.key))show(+e.key)});
function fit(){const k=Math.min(1,innerWidth/1920);document.getElementById('wrap').style.transform='scale('+k+')';document.getElementById('wrap').style.height=(1080*k)+'px'}addEventListener('resize',fit);fit();show(1);
</script></body></html>
