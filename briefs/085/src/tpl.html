<!doctype html><html lang="en"><meta charset="utf-8"><title>085 · People, new actions, doing, log</title>
<style>
/*FONTS*/
/*KIT*/
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10201f;color:#f7f4ec;font:14px/1.35 system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100%}
#left{min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b1615}
#stagebox{position:relative}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font:700 15px/1.2 Jost,sans-serif;color:#f7f4ec;background-size:cover}
#rail{overflow:auto;background:#0b1615;padding:12px 14px 30px;border-left:1px solid #2f5350}
#rail h1{font:700 19px/1.15 Jost,sans-serif;margin:2px 0 4px}#rail h2{font:700 14px Jost,sans-serif;margin:14px 0 5px;color:#60e0ea}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px}
button{font:700 13px Jost,sans-serif;color:#f7f4ec;background:#17302f;border:1px solid #2f5350;border-radius:5px;padding:5px 9px;cursor:pointer}button:hover{background:#21403e}button.on{background:#60e0ea;color:#0b1615;border-color:#60e0ea}
.opts{display:flex;flex-wrap:wrap;gap:4px}.small{font-size:13px;color:#b0cdc7;margin:4px 0 8px}.say{font-size:13px;margin:6px 0}
.pick{border-left:3px solid #99784d;padding:3px 0 3px 9px;margin:8px 0;font-size:13px}
#rail ul{padding-left:17px;margin:6px 0;font-size:13px}#rail li{margin:4px 0}

/* the kit: frames are the sprites, never fills */
.ic{display:inline-block;width:16px;height:16px;flex:none;background:var(--c,#f7f4ec);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.panel{position:absolute;border-style:solid;border-width:17.5px;border-image:var(--panel) 35 fill/17.5px stretch}
.plate{display:inline-flex;align-items:center;height:30px;padding:0 10px;gap:6px;border-style:solid;border-width:7px;border-image:var(--plate) 24 fill/7.2px stretch;white-space:nowrap}
.pad0{padding:0 2px}
.cam{width:22px;height:22px;border-radius:50%;background-size:cover;background-position:center;flex:none;box-shadow:0 0 0 1.5px #cbc6c3,0 0 0 2.5px #0b1615}
.cam.bare{box-shadow:none;background-size:contain;background-repeat:no-repeat}
.dim{color:#b0cdc7}.tq{color:#60e0ea}
.abs{position:absolute}

/* the people board */
#board{right:14px;top:110px;width:444px;padding:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s;transform-origin:100% 0}
#board.hide{opacity:0;transform:translateX(40px)}
#board .head{display:flex;align-items:center;gap:9px;height:34px;padding:0 16px 8px 4px;border-bottom:1px solid #99784d;margin-bottom:7px;font-size:15px}
#board .head .cam{width:26px;height:26px}
.row{position:relative;border-radius:9px;border:1px solid rgba(110,175,168,.43);background:#16423f;margin-bottom:6px;padding:7px 9px 7px 9px;cursor:pointer;transition:opacity .3s,box-shadow .2s}
.row.focus{background:#205859}
.row.lit{box-shadow:0 0 0 2px #60e0ea,0 0 16px rgba(96,224,234,.55)}
.row .top{display:flex;align-items:center;gap:10px}
.row .face{width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center;flex:none;position:relative;box-shadow:0 0 0 2px #cbc6c3,0 0 0 3px #0b1615}
.row:not(.focus) .face{width:38px;height:38px}
.row .face.bare{box-shadow:none;background-size:contain;background-repeat:no-repeat}
.row.turned .face::after{content:"";position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;background:var(--mk_ok) center/contain no-repeat}
.row .nm{font-size:17px;line-height:1.1}.row .why{font-size:13.5px;color:#b0cdc7;margin-top:2px;white-space:nowrap}
.row .glance{margin-left:auto;display:flex;gap:3px;align-items:center}
.gdot{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#0a2624;border-radius:50%;position:relative}
.gdot .ic{width:13px;height:13px}
.gdot.unk{background:none;outline:1.3px dotted rgba(247,244,236,.65)}
.gdot.told{outline:1.3px dashed #f7f4ec}
.gdot.next{outline:2px solid #60e0ea;background:#0a2624;width:50px;height:28px;border-radius:14px;gap:5px;margin-left:3px;cursor:pointer}
.learn{display:flex;align-items:center;gap:6px;margin-top:7px}
.act{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 7px;border-radius:8px;background:#0a2624;box-shadow:0 0 0 1.3px #cbc6c3;font:700 14px Jost;color:#f7f4ec;flex:none;cursor:pointer}
.act:hover{box-shadow:0 0 0 2px #60e0ea}
.act.next{box-shadow:0 0 0 2px #60e0ea}.act.next .w{color:#60e0ea}
.act .cam{width:20px;height:20px}
.act .ic{width:15px;height:15px}
.act .sweep{position:absolute;left:0;top:0;bottom:0;background:rgba(96,224,234,.4);width:0}
.act>*:not(.sweep){position:relative}
.slots{display:flex;gap:5px;flex:1;min-width:0}
.slot{display:flex;align-items:center;gap:5px;height:32px;padding:0 8px;border-radius:7px;background:#0a2624;font:700 13px Jost;white-space:nowrap;flex:0 1 auto;min-width:0;transition:box-shadow .25s}
.slot .ic{width:15px;height:15px}
.slot.unk{background:none;color:#b0cdc7;outline:1.4px dotted rgba(247,244,236,.6);outline-offset:-2px}
.slot.told{outline:1.4px dashed #f7f4ec;outline-offset:-2px}
.slot.known{box-shadow:0 0 0 1.3px #f7f4ec}
.slot.fill{animation:fill .9s ease-out}
@keyframes fill{0%{box-shadow:0 0 0 3px #60e0ea,0 0 22px #60e0ea;transform:scale(1.08)}100%{box-shadow:0 0 0 1.3px #f7f4ec;transform:none}}
.ways{display:flex;gap:5px;margin-top:6px}
.way{position:relative;flex:1 1 auto;justify-content:center;padding:0 7px;gap:5px}
.way .mk{width:15px;height:15px;background-size:contain;background-repeat:no-repeat;flex:none}
.way.shut{opacity:1;color:rgba(176,205,199,.7);background:rgba(10,38,36,.5);box-shadow:0 0 0 1px rgba(203,198,195,.3);cursor:default}
.way.shut .ic{--c:rgba(176,205,199,.7)}.way.shut:hover{box-shadow:0 0 0 1px rgba(203,198,195,.3)}
.way.fresh{box-shadow:0 0 0 2px #60e0ea,0 0 10px rgba(96,224,234,.6)}
.way.fresh::after,.sparkle{content:"";position:absolute;right:1px;top:1px;width:13px;height:13px;background:#f7f4ec;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twink 1.2s infinite}
@keyframes twink{50%{transform:scale(.6) rotate(45deg)}}
.price{height:20px;margin-top:6px;font-size:13.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.price .ic{width:13px;height:13px}.price .ic.i-p_trail{--c:#b0cdc7}
.tip{display:flex;gap:8px;align-items:center;margin:2px 3px 0 9px;height:22px;font-size:14px;color:#f7f4ec}
.tip .hd{color:#60e0ea}
/* later: today's grammar, quieter */
#board.later{width:318px}#board.later .row{padding:6px 8px}#board.later .tip,#board.later .why,#board.later .head{display:none}
/* the world marks */
.tag{position:absolute;height:32px;display:inline-flex;gap:7px;padding-right:12px;transition:transform .25s,opacity .3s;transform-origin:50% 100%}
.tag.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.tag.lit{box-shadow:0 0 0 2px #60e0ea;border-radius:9px}
.tail{position:absolute;width:0;height:0}
.tailD{border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid #cbc6c3}
.tailR{border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:9px solid #cbc6c3}
.gring{position:absolute;border:2.6px solid #60e0ea;border-radius:50%;animation:gr 1.5s ease-out infinite;pointer-events:none}
@keyframes gr{0%{transform:scale(.65);opacity:1}100%{transform:scale(1.25);opacity:0}}
/* the act plate */
.doing{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);pointer-events:none}
.doing .plate{position:relative;height:34px;font-size:14.5px;padding:0 9px 0 5px;overflow:visible}
.doing .ud{position:absolute;left:3px;right:3px;bottom:-5.5px;height:2.5px;background:rgba(255,255,255,.18);border-radius:2px}
.doing .ud i{display:block;height:100%;background:#60e0ea;border-radius:2px}
.doing .plate .cam{width:20px;height:20px}
.doing .d{width:26px;height:26px;margin-left:-3px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#0a2624;box-shadow:0 0 0 1.2px #cbc6c3;flex:none;position:relative}
.doing .d .ic{width:17px;height:17px}
.doing.going .d{box-shadow:none;outline:1.6px dashed #f7f4ec;animation:spinD 2s linear infinite}
.doing.going .d .ic{animation:spinR 2s linear infinite}
@keyframes spinD{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
.doing .tl{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid #0c3434;margin-top:3px;filter:drop-shadow(0 1px 0 #cbc6c3) drop-shadow(1px 0 0 #cbc6c3) drop-shadow(-1px 0 0 #cbc6c3)}
.doing.sel .tl{border-left-width:11px;border-right-width:11px;border-top:15px solid #60e0ea;filter:drop-shadow(0 0 0 #0b1615) drop-shadow(0 1px 0 #0b1615);margin-top:5px}
.doing .eye{width:26px;height:26px;background:var(--disc) center/contain no-repeat;margin-left:4px;margin-right:-3px;display:flex;align-items:center;justify-content:center}
.doing .eye .ic{width:14px;height:14px}
.built{position:absolute;pointer-events:none}.built .disc{position:absolute;left:0;top:0;width:36px;height:36px;background:var(--disc) center/contain no-repeat;display:flex;align-items:center;justify-content:center}
.built .disc .ic{width:21px;height:21px}
.built .plate{position:absolute;left:37px;top:7px;height:22px;font-size:13.5px;padding:0 3px;border-width:6px;border-image-width:6px}
.chev{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:15px solid #60e0ea;filter:drop-shadow(0 1px 0 #0b1615)}
/* the gain chip */
.chip{position:absolute;padding:0;z-index:6;width:330px;pointer-events:auto;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.chip .tp{display:flex;gap:10px}.chip .tp .cam{width:32px;height:32px;position:relative}
.chip .tp .cam::after{content:"";position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;background:var(--mk_ok) center/contain no-repeat}
.chip .ln{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:3px}
.chip .hr{height:1px;background:#99784d;margin:7px 0}
.newhd{font-size:16px;color:#60e0ea;display:flex;align-items:center;gap:7px;margin-bottom:6px;white-space:nowrap}
.newhd .who{color:#f7f4ec}
.chip .pl,.callout .pl{display:flex;gap:6px}
.pl .act{height:34px}
.fly{position:absolute;z-index:9;transition:left .75s cubic-bezier(.6,0,.3,1),top .75s cubic-bezier(.6,0,.3,1),opacity .75s,transform .75s;pointer-events:none}
.callout{position:absolute;z-index:7;padding:0;width:292px;animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.callout .tailr{position:absolute;right:-27px;top:30px;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:10px solid #cbc6c3}
.pulse{position:absolute;width:100px;height:62px;border:2.6px solid #60e0ea;border-radius:50%;animation:gr 1.4s ease-out infinite}
/* the log */
#log{position:absolute;right:14px;bottom:60px;padding:0;width:400px}
.ln2{display:flex;align-items:center;gap:9px;height:38px;border-radius:7px;padding:0 6px;font-size:15px;cursor:pointer;white-space:nowrap}
.ln2:hover{background:rgba(96,224,234,.14)}
.ln2 .dd{width:28px;height:28px;background:var(--disc) center/contain no-repeat;display:flex;align-items:center;justify-content:center;flex:none}.ln2 .dd .ic{width:15px;height:15px}
.ln2 .cam{width:24px;height:24px}
.ln2 .tm{margin-left:auto;font-variant-numeric:tabular-nums}
.ln2.old{color:#b0cdc7;height:30px;font-size:14px}.ln2.old .dd{opacity:.7;width:24px;height:24px}
.lhd{font-size:13px;color:#b0cdc7;margin:4px 6px 2px;display:flex;align-items:center;justify-content:space-between}
.ulim{position:absolute;left:6px;right:6px;bottom:2px;height:2.5px;background:#60e0ea}
.nowstack{position:absolute;right:14px;bottom:60px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.nowstack .plate{height:38px;font-size:15px;border-width:9px;border-image-width:10px;padding:0 10px 0 4px;cursor:pointer;gap:8px;position:relative}
.nowstack .plate .dd{width:26px;height:26px;background:var(--disc) center/contain no-repeat;display:flex;align-items:center;justify-content:center}
.nowstack .plate .dd .ic{width:15px;height:15px}.nowstack .cam{width:22px;height:22px}
.bg{position:absolute;inset:0;background-size:100% 100%}
/* seen */
#seen{position:absolute;inset:0;background:#0f2120;padding:46px 60px;overflow:hidden}
#seen h3{font:700 26px Jost;margin:0 0 6px;color:#60e0ea}#seen p{font:500 19px/1.35 Barlow,sans-serif;margin:0 0 12px;max-width:1000px}
.seengrid{display:grid;grid-template-columns:1fr 1fr;gap:30px 50px}.seengrid img{display:block;border:1px solid #2f5350;max-width:100%;margin:6px 0}
.tagc{font:700 15px Jost;color:#b0cdc7}
</style>
<div id="app"><div id="left"><div id="stagebox"><div id="stage"></div></div></div><div id="rail"></div></div>
<script>
/*FRAMES*/
/*APP*/
</script></html>
