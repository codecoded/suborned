<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="book.css">
<style>
.bookkey{right:14px;bottom:14px;height:40px;display:flex;align-items:center;padding:0 6px 0 2px;gap:8px;font:700 15px Jost}
.bookkey .ic{width:22px;height:22px;color:var(--cream)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--turq);box-shadow:0 0 6px var(--turq)}
.tag{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font:700 17px Jost;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
</style></head><body>
<div class="street" style="background-image:url(bg/start-hud.png)"></div>
<!-- the book key replaces the notes key, bottom right; the notes become the book's Journal -->
<div class="plate bookkey"><i class="ic" style="--i:url(bookglyph.svg)"></i>Book<span class="dot"></span></div>
<!-- the pause glyph on the pill becomes a button (hover ring shown) -->
<div class="abs" style="left:1861px;top:23px;width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px var(--turq),0 0 8px var(--turq)"></div>
<!-- turn the view: two arrows on the scope's rim -->
<div class="abs disc" style="left:24px;top:925px;width:28px;height:28px"><i class="ic" style="--i:url(../../../../unity/Assets/Suborned/UI/Resources/Kit/icons/singles/turn_view@2x.png);width:17px;height:17px;transform:scaleX(-1)"></i></div>
<div class="abs disc" style="left:188px;top:925px;width:28px;height:28px"><i class="ic" style="--i:url(../../../../unity/Assets/Suborned/UI/Resources/Kit/icons/singles/turn_view@2x.png);width:17px;height:17px"></i></div>
<div class="tag" style="left:1838px;top:960px">1</div>
<div class="tag" style="left:1772px;top:66px">2</div>
<div class="tag" style="left:104px;top:898px">3</div>
</body></html>
