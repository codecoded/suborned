<!doctype html>
<meta charset="utf-8">
<title>The Suborned · HUD style lab</title>
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="lab.css">
<link rel="stylesheet" href="ranges.css">
<body>
<header>
  <h1>HUD style lab</h1>
  <nav id="tabs"></nav>
  <span class="grow"></span>
  <span id="status"></span>
</header>
<main>
  <section id="view">
    <div id="bar">
      <label>Scene <select id="scene"></select></label>
      <label>Cause <select id="cause"></select></label>
      <label id="groundL">Ground <select id="ground"></select></label>
      <span class="seg" id="zoom"><button data-z="fit">Fit</button><button data-z="1">1x</button><button data-z="2">2x</button></span>
      <label>Jump <select id="jump"><option value="">piece…</option></select></label>
      <label>Shooter <input type="range" id="theta" min="0" max="355" step="5" style="width:90px"><span id="thetaV">40°</span></label>
      <label>Ring <select id="ring"><option value="selected">selected</option><option value="hint">hint</option><option value="none">none</option></select></label>
      <label><input type="checkbox" id="occ"> Behind agent</label>
      <label><input type="checkbox" id="intelOn"> Intel card</label>
      <label><input type="checkbox" id="guidesOn"> Slot guides</label>
      <span class="hint">Press and hold any “Hold” pill. Key \ flips to the last preset.</span>
    </div>
    <div id="scroll"><div id="sizer"><div id="stage" class="hud"></div></div></div>
  </section>
  <aside id="panel"></aside>
</main>
<div id="errors"></div>
<script type="module" src="app.js"></script>
